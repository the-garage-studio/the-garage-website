<section id="testimonials" aria-label="Testimonials — Members Speak">
  <div class="container">

    <!-- Section Header -->
    <div class="testi-head reveal" #revealEl>
      <span class="eyebrow">Members Speak</span>
      <h2>Trusted by a community that takes its craft seriously.</h2>
    </div>

    <!-- Testimonial Cards Grid -->
    <div class="testi-grid">
      @for (testi of testimonials; track testi.name) {
        <article class="testi-card reveal" #revealEl>
          <div class="testi-quote" aria-hidden="true">&rdquo;</div>
          <p class="quote-text">{{ testi.quote }}</p>
          <div class="testi-person">
            <div class="testi-avatar" aria-hidden="true"></div>
            <div>
              <div class="name">{{ testi.name }}</div>
              <div class="role">{{ testi.role }}</div>
            </div>
          </div>
        </article>
      }
    </div>

  </div>
</section>
